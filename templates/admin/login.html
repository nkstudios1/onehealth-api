{% extends "admin/base.html" %}

{% block content %}
{{ block.super }}

{% if not user.is_authenticated %}
<div style="margin-top: 22px; border-top: 1px solid #d0d7de; padding-top: 18px;">
    <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #57606a; margin-bottom: 10px;">
        Login with email or phone
    </div>
    <div style="border: 1px solid #d0d7de; border-radius: 8px; background: #f6f8fa; padding: 14px; max-width: 520px;">
        <form method="post" action="{% url 'admin:login' %}">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next|default:'/' }}">
            <div style="display: grid; gap: 12px;">
                <div>
                    <label for="id_username" style="display:block; font-weight:600; margin-bottom:6px; color:#24292f;">Email or phone number</label>
                    <input type="text" name="username" id="id_username" autofocus required style="width:100%; padding:10px 12px; border:1px solid #d0d7de; border-radius:6px; box-sizing:border-box; font-size:14px;">
                </div>
                <div>
                    <label for="id_password" style="display:block; font-weight:600; margin-bottom:6px; color:#24292f;">Password</label>
                    <input type="password" name="password" id="id_password" required style="width:100%; padding:10px 12px; border:1px solid #d0d7de; border-radius:6px; box-sizing:border-box; font-size:14px;">
                </div>
                <button type="submit" style="display:inline-block; padding:10px 16px; border:1px solid #1f6feb; border-radius:6px; background:#1f6feb; color:#fff; text-decoration:none; font-weight:600; cursor:pointer;">Login</button>
            </div>
        </form>
    </div>
</div>

<div style="margin-top: 18px; border-top: 1px solid #d0d7de; padding-top: 18px;">
    <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #57606a; margin-bottom: 10px;">
        Create an account
    </div>
    <div style="display: flex; flex-wrap: wrap; gap: 10px;">
        <a href="/api/v1/auth/register/patient-page/" style="display:inline-block; padding:8px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2937; text-decoration:none; font-weight:600;">Register as Patient</a>
        <a href="/api/v1/auth/register/hospital-page/" style="display:inline-block; padding:8px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2937; text-decoration:none; font-weight:600;">Register Hospital</a>
        <a href="/api/v1/auth/register/staff-page/" style="display:inline-block; padding:8px 12px; border:1px solid #d0d7de; border-radius:6px; background:#fff; color:#1f2937; text-decoration:none; font-weight:600;">Register Staff</a>
    </div>
</div>
{% endif %}
{% endblock %}
